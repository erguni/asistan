name: Asistan APK Uretici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Proje Dosyalarini ve Kodlari Otomatik Olustur
        run: |
          mkdir -p app/src/main/java/com/asistan/app

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Asistan"
          include(":app")
          EOF

          # build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.asistan.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.asistan.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 5
                  versionName = "5.0-Ultimate-AI"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("androidx.work:work-runtime-ktx:2.9.0")
          }
          EOF

          # app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Gerekli Tüm Sistem ve Donanım İzinleri -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_CALENDAR" />
              <uses-permission android:name="android.permission.WRITE_CALENDAR" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="Ultimate AI Asistan"
                  android:roundIcon="@android:drawable/ic_dialog_info"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AssistantNotificationService"
                      android:label="AI Asistan Bildirim Dinleyici"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # AssistantNotificationService.kt
          cat << 'EOF' > app/src/main/java/com/asistan/app/AssistantNotificationService.kt
          package com.asistan.app

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class AssistantNotificationService : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  sbn?.notification?.extras?.let { extras ->
                      val title = extras.getString("android.title") ?: ""
                      val text = extras.getCharSequence("android.text")?.toString() ?: ""
                      val pkg = sbn.packageName ?: ""

                      if (title.isBlank() && text.isBlank()) return

                      val appType = when {
                          pkg.contains("gm") || pkg.contains("email") -> "✉️ Mail"
                          pkg.contains("outlook") -> "💼 Outlook"
                          pkg.contains("whatsapp") -> "💬 WhatsApp"
                          pkg.contains("mms") || pkg.contains("sms") -> "📱 SMS"
                          else -> null
                      }

                      if (appType != null) {
                          val time = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                          val prefs = getSharedPreferences("asistan_veriler", MODE_PRIVATE)
                          val current = prefs.getString("bildirimler_listesi", "") ?: ""
                          val entry = "$time###$appType###$title###$text"
                          prefs.edit().putString("bildirimler_listesi", "$entry|||$current").apply()
                      }
                  }
              }
          }
          EOF

          # AssistantWorker.kt (Arka Plan Kontrolcüsü)
          cat << 'EOF' > app/src/main/java/com/asistan/app/AssistantWorker.kt
          package com.asistan.app

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Context
          import android.os.Build
          import androidx.core.app.NotificationCompat
          import androidx.work.CoroutineWorker
          import androidx.work.WorkerParameters

          class AssistantWorker(context: Context, params: WorkerParameters) : CoroutineWorker(context, params) {
              override suspend fun doWork(): Result {
                  val prefs = applicationContext.getSharedPreferences("asistan_veriler", Context.MODE_PRIVATE)
                  val notifCount = prefs.getString("bildirimler_listesi", "")?.split("|||")?.filter { it.isNotBlank() }?.size ?: 0
                  
                  if (notifCount > 0) {
                      showNotification("🤖 Asistan Hatırlatması", "İncelemeniz gereken yeni mail veya mesaj bildirimleri var.")
                  }
                  return Result.success()
              }

              private fun showNotification(title: String, message: String) {
                  val manager = applicationContext.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val channelId = "asistan_alerts"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Asistan Bildirimleri", NotificationManager.IMPORTANCE_DEFAULT)
                      manager.createNotificationChannel(channel)
                  }
                  val notification = NotificationCompat.Builder(applicationContext, channelId)
                      .setContentTitle(title)
                      .setContentText(message)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setAutoCancel(true)
                      .build()
                  manager.notify(1001, notification)
              }
          }
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/asistan/app/MainActivity.kt
          package com.asistan.app

          import android.Manifest
          import android.app.AlarmManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.CalendarContract
          import android.provider.CallLog
          import android.provider.Settings
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.core.content.ContextCompat
          import androidx.work.PeriodicWorkRequestBuilder
          import androidx.work.WorkManager
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Calendar
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          data class CallInfo(val name: String, val number: String, val date: String)
          data class NotificationItem(val time: String, val type: String, val title: String, val text: String)
          data class ChatMessage(val sender: String, val text: String)

          class MainActivity : ComponentActivity(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null
              private var voiceInputCallback: ((String) -> Unit)? = null

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { _ -> }

              private val speechLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == RESULT_OK && result.data != null) {
                      val spokenText = result.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.get(0) ?: ""
                      voiceInputCallback?.invoke(spokenText)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  tts = TextToSpeech(this, this)
                  requestAppPermissions()
                  setupBackgroundWorker()

                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              MainAssistantApp(
                                  onRefreshAlarms = { checkAlarmStatus() },
                                  onRefreshCalls = { getUnreturnedCalls() },
                                  onRefreshNotifications = { getStoredNotifications() },
                                  onCallNumber = { num ->
                                      startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:$num")))
                                  },
                                  onRequestPermissions = { requestAppPermissions() },
                                  onOpenNotificationSettings = {
                                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                                  },
                                  onClearData = { clearAllData() },
                                  getApiKey = { getSavedApiKey() },
                                  saveApiKey = { key -> saveApiKeyToPrefs(key) },
                                  callGemini = { prompt -> askGemini(prompt) },
                                  onSpeakText = { text -> speakOut(text) },
                                  onStopSpeaking = { stopSpeaking() },
                                  onStartVoiceInput = { callback ->
                                      voiceInputCallback = callback
                                      startVoiceRecognition()
                                  },
                                  onCopyToClipboard = { text -> copyToClipboard(text) },
                                  onAddToCalendar = { title, desc -> openCalendarInsert(title, desc) }
                              )
                          }
                      }
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("tr", "TR")
                  }
              }

              private fun speakOut(text: String) {
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "AsistanTTS")
              }

              private fun stopSpeaking() {
                  tts?.stop()
              }

              private fun startVoiceRecognition() {
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "tr-TR")
                      putExtra(RecognizerIntent.EXTRA_PROMPT, "Asistan dinliyor...")
                  }
                  speechLauncher.launch(intent)
              }

              private fun copyToClipboard(text: String) {
                  val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clip = ClipData.newPlainText("AI Yanıtı", text)
                  clipboard.setPrimaryClip(clip)
                  Toast.makeText(this, "Panoya kopyalandı!", Toast.LENGTH_SHORT).show()
              }

              private fun openCalendarInsert(title: String, description: String) {
                  val intent = Intent(Intent.ACTION_INSERT).apply {
                      data = CalendarContract.Events.CONTENT_URI
                      putExtra(CalendarContract.Events.TITLE, title)
                      putExtra(CalendarContract.Events.DESCRIPTION, description)
                  }
                  startActivity(intent)
              }

              private fun setupBackgroundWorker() {
                  val workRequest = PeriodicWorkRequestBuilder<AssistantWorker>(3, TimeUnit.HOURS).build()
                  WorkManager.getInstance(this).enqueue(workRequest)
              }

              private fun requestAppPermissions() {
                  permissionLauncher.launch(
                      arrayOf(
                          Manifest.permission.READ_CALL_LOG,
                          Manifest.permission.READ_SMS,
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.POST_NOTIFICATIONS,
                          Manifest.permission.READ_CALENDAR,
                          Manifest.permission.WRITE_CALENDAR
                      )
                  )
              }

              private fun checkAlarmStatus(): Pair<Boolean, String> {
                  val alarmManager = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val nextAlarm = alarmManager.nextAlarmClock
                  val calendar = Calendar.getInstance()
                  val dayOfWeek = calendar.get(Calendar.DAY_OF_WEEK)
                  val isWeekday = dayOfWeek in Calendar.MONDAY..Calendar.FRIDAY

                  return if (nextAlarm != null) {
                      Pair(true, "Aktif alarmınız kurulu.")
                  } else if (isWeekday) {
                      Pair(false, "Yarın hafta içi fakat alarm bulunamadı!")
                  } else {
                      Pair(true, "Hafta sonu, alarm yok.")
                  }
              }

              private fun getUnreturnedCalls(): List<CallInfo> {
                  val list = mutableListOf<CallInfo>()
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALL_LOG) != PackageManager.PERMISSION_GRANTED) {
                      return emptyList()
                  }
                  try {
                      val cursor = contentResolver.query(
                          CallLog.Calls.CONTENT_URI,
                          arrayOf(CallLog.Calls.NUMBER, CallLog.Calls.TYPE, CallLog.Calls.CACHED_NAME, CallLog.Calls.DATE),
                          null, null, "${CallLog.Calls.DATE} DESC LIMIT 30"
                      )
                      cursor?.use {
                          while (it.moveToNext()) {
                              val type = it.getInt(it.getColumnIndexOrThrow(CallLog.Calls.TYPE))
                              val number = it.getString(it.getColumnIndexOrThrow(CallLog.Calls.NUMBER)) ?: "Bilinmeyen"
                              val name = it.getString(it.getColumnIndexOrThrow(CallLog.Calls.CACHED_NAME)) ?: number
                              if (type == CallLog.Calls.MISSED_TYPE) {
                                  list.add(CallInfo(name, number, "Cevapsız"))
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return list
              }

              private fun getStoredNotifications(): List<NotificationItem> {
                  val prefs = getSharedPreferences("asistan_veriler", MODE_PRIVATE)
                  val raw = prefs.getString("bildirimler_listesi", "") ?: ""
                  if (raw.isBlank()) return emptyList()

                  return raw.split("|||").filter { it.isNotBlank() }.mapNotNull { item ->
                      val parts = item.split("###")
                      if (parts.size >= 4) {
                          NotificationItem(parts[0], parts[1], parts[2], parts[3])
                      } else null
                  }
              }

              private fun saveApiKeyToPrefs(key: String) {
                  getSharedPreferences("asistan_veriler", MODE_PRIVATE).edit().putString("gemini_key", key.trim()).apply()
              }

              private fun getSavedApiKey(): String {
                  return getSharedPreferences("asistan_veriler", MODE_PRIVATE).getString("gemini_key", "") ?: ""
              }

              private fun clearAllData() {
                  getSharedPreferences("asistan_veriler", MODE_PRIVATE).edit().clear().apply()
              }

              private suspend fun askGemini(prompt: String): String = withContext(Dispatchers.IO) {
                  val apiKey = getSavedApiKey()
                  if (apiKey.isBlank()) {
                      return@withContext "Lütfen 'Ayarlar' sekmesinden Gemini API anahtarınızı girin."
                  }

                  val modelsToTry = listOf("gemini-2.0-flash", "gemini-1.5-flash-latest", "gemini-2.5-flash", "gemini-pro")
                  var lastError = ""

                  for (model in modelsToTry) {
                      try {
                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=$apiKey")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Content-Type", "application/json; utf-8")
                          conn.doOutput = true

                          val jsonBody = JSONObject().apply {
                              val contents = JSONArray().apply {
                                  val item = JSONObject().apply {
                                      val parts = JSONArray().apply {
                                          put(JSONObject().put("text", prompt))
                                      }
                                      put("parts", parts)
                                  }
                                  put(item)
                              }
                              put("contents", contents)
                          }

                          OutputStreamWriter(conn.outputStream).use { os ->
                              os.write(jsonBody.toString())
                              os.flush()
                          }

                          val responseCode = conn.responseCode
                          if (responseCode == 200) {
                              val responseText = conn.inputStream.bufferedReader().use { it.readText() }
                              val resJson = JSONObject(responseText)
                              val candidates = resJson.getJSONArray("candidates")
                              if (candidates.length() > 0) {
                                  return@withContext candidates.getJSONObject(0)
                                      .getJSONObject("content")
                                      .getJSONArray("parts")
                                      .getJSONObject(0)
                                      .getString("text")
                              }
                          } else {
                              val errorText = conn.errorStream?.bufferedReader()?.use { it.readText() } ?: ""
                              lastError = "Model $model: $errorText"
                              if (responseCode == 404) continue
                              else return@withContext "API Hatası ($responseCode): $errorText"
                          }
                      } catch (e: Exception) {
                          lastError = "Hata: ${e.message}"
                      }
                  }
                  return@withContext "Yapay zeka modellerine ulaşılamadı. Son hata: $lastError"
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }

          @Composable
          fun MainAssistantApp(
              onRefreshAlarms: () -> Pair<Boolean, String>,
              onRefreshCalls: () -> List<CallInfo>,
              onRefreshNotifications: () -> List<NotificationItem>,
              onCallNumber: (String) -> Unit,
              onRequestPermissions: () -> Unit,
              onOpenNotificationSettings: () -> Unit,
              onClearData: () -> Unit,
              getApiKey: () -> String,
              saveApiKey: (String) -> Unit,
              callGemini: suspend (String) -> String,
              onSpeakText: (String) -> Unit,
              onStopSpeaking: () -> Unit,
              onStartVoiceInput: (((String) -> Unit)) -> Unit,
              onCopyToClipboard: (String) -> Unit,
              onAddToCalendar: (String, String) -> Unit
          ) {
              var selectedTab by remember { mutableStateOf(0) }
              val tabs = listOf("Brifing", "Sohbet", "Arama", "Mesaj", "Ayarlar")

              var alarmState by remember { mutableStateOf(Pair(true, "Yükleniyor...")) }
              var callsList by remember { mutableStateOf<List<CallInfo>>(emptyList()) }
              var notificationsList by remember { mutableStateOf<List<NotificationItem>>(emptyList()) }

              fun refreshAll() {
                  alarmState = onRefreshAlarms()
                  callsList = onRefreshCalls()
                  notificationsList = onRefreshNotifications()
              }

              LaunchedEffect(Unit) {
                  refreshAll()
              }

              Scaffold(
                  bottomBar = {
                      NavigationBar {
                          tabs.forEachIndexed { index, title ->
                              NavigationBarItem(
                                  selected = selectedTab == index,
                                  onClick = { selectedTab = index },
                                  label = {
                                      Text(
                                          title,
                                          style = MaterialTheme.typography.labelSmall,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                  },
                                  icon = { }
                              )
                          }
                      }
                  }
              ) { padding ->
                  Box(modifier = Modifier.padding(padding).fillMaxSize()) {
                      when (selectedTab) {
                          0 -> AiBriefingScreen(alarmState, callsList, notificationsList, callGemini, onRefresh = { refreshAll() }, onSpeakText, onStopSpeaking, onAddToCalendar)
                          1 -> AiChatScreen(alarmState, callsList, notificationsList, callGemini, onStartVoiceInput)
                          2 -> CallsScreen(callsList, onCallNumber, onRequestPermissions)
                          3 -> NotificationsScreen(notificationsList, onOpenNotificationSettings, callGemini, onCopyToClipboard)
                          4 -> SettingsScreen(getApiKey, saveApiKey, onClearData = {
                              onClearData()
                              refreshAll()
                          }, onOpenNotificationSettings, onRequestPermissions)
                      }
                  }
              }
          }

          @Composable
          fun AiBriefingScreen(
              alarmState: Pair<Boolean, String>,
              callsList: List<CallInfo>,
              notificationsList: List<NotificationItem>,
              callGemini: suspend (String) -> String,
              onRefresh: () -> Unit,
              onSpeakText: (String) -> Unit,
              onStopSpeaking: () -> Unit,
              onAddToCalendar: (String, String) -> Unit
          ) {
              var aiSummary by remember { mutableStateOf("Yapay zekadan günlük yönetici brifingi almak için aşağıdaki butona basın.") }
              var isLoading by remember { mutableStateOf(false) }
              var isSpeaking by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()

              fun generateBriefing() {
                  scope.launch {
                      isLoading = true
                      onRefresh()
                      val callsText = callsList.joinToString("\n") { "- ${it.name} (${it.number})" }
                      val notesText = notificationsList.joinToString("\n") { "[${it.type}] ${it.title}: ${it.text}" }
                      val prompt = """
                          Sen kullanıcının kişisel akıllı asistanısın. Aşağıda kullanıcının telefonundaki güncel veriler var:
                          
                          ALARM: ${alarmState.second}
                          CEVAPSIZ ARAMALAR:
                          $callsText
                          GELEN MAİL VE MESAJLAR:
                          $notesText
                          
                          GÖREVİN:
                          1. Samimi ve profesyonel bir günlük yönetici özeti ver.
                          2. Hava durumuna uygun genel bir tavsiye ekle (giyim/hava).
                          3. Acil aranması gerekenler ve cevap bekleyen mailleri maddeler halinde sırala.
                          4. Varsa takvime kaydedilmesi gereken bir randevu/etkinlik belirt.
                      """.trimIndent()

                      aiSummary = callGemini(prompt)
                      isLoading = false
                  }
              }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("🧠 AI Yönetici Brifingi", style = MaterialTheme.typography.headlineSmall)
                      Spacer(modifier = Modifier.height(12.dp))
                  }
                  item {
                      Button(
                          onClick = { generateBriefing() },
                          enabled = !isLoading,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          if (isLoading) {
                              CircularProgressIndicator(color = MaterialTheme.colorScheme.onPrimary, modifier = Modifier.size(20.dp))
                              Spacer(modifier = Modifier.width(8.dp))
                              Text("Analiz Ediliyor...")
                          } else {
                              Text("✨ Günlük Durumu Analiz Et")
                          }
                      }
                      Spacer(modifier = Modifier.height(12.dp))
                  }
                  item {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.primaryContainer),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Text("🤖 Asistan Raporu", style = MaterialTheme.typography.titleMedium)
                                  Row {
                                      IconButton(onClick = {
                                          if (isSpeaking) {
                                              onStopSpeaking()
                                              isSpeaking = false
                                          } else {
                                              onSpeakText(aiSummary)
                                              isSpeaking = true
                                          }
                                      }) {
                                          Text(if (isSpeaking) "⏹️" else "🔊")
                                      }
                                  }
                              }
                              Spacer(modifier = Modifier.height(8.dp))
                              Text(aiSummary, style = MaterialTheme.typography.bodyMedium)
                              Spacer(modifier = Modifier.height(12.dp))
                              OutlinedButton(
                                  onClick = { onAddToCalendar("Asistan Görevi", aiSummary) },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("📅 Takvime Hatırlatıcı Ekle")
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun AiChatScreen(
              alarmState: Pair<Boolean, String>,
              callsList: List<CallInfo>,
              notificationsList: List<NotificationItem>,
              callGemini: suspend (String) -> String,
              onStartVoiceInput: (((String) -> Unit)) -> Unit
          ) {
              val messages = remember { mutableStateListOf(ChatMessage("asistan", "Merhaba! Ben kişisel yapay zeka asistanınızım. Bana yazabilir veya mikrofon butonuna basarak sesli konuşabilirsiniz.")) }
              var userInput by remember { mutableStateOf("") }
              var isTyping by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()

              fun sendMessage(textToSend: String) {
                  if (textToSend.isNotBlank() && !isTyping) {
                      messages.add(ChatMessage("kullanici", textToSend))
                      userInput = ""
                      isTyping = true

                      scope.launch {
                          val callsText = callsList.joinToString("\n") { "- ${it.name} (${it.number})" }
                          val notesText = notificationsList.joinToString("\n") { "[${it.type}] ${it.title}: ${it.text}" }
                          val fullPrompt = """
                              Sen kullanıcının cep telefonundaki akıllı kişisel asistanısın.
                              Telefon verileri:
                              ALARM: ${alarmState.second}
                              CEVAPSIZ ARAMALAR:
                              $callsText
                              BİLDİRİM VE MAİLLER:
                              $notesText
                              
                              Kullanıcının sorusu: $textToSend
                              Yanıtını samimi, net ve doğrudan Türkçe ver.
                          """.trimIndent()

                          val reply = callGemini(fullPrompt)
                          messages.add(ChatMessage("asistan", reply))
                          isTyping = false
                      }
                  }
              }

              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("💬 Asistanla Sohbet", style = MaterialTheme.typography.headlineSmall)
                  Spacer(modifier = Modifier.height(8.dp))

                  LazyColumn(modifier = Modifier.weight(1f).fillMaxWidth()) {
                      items(messages) { msg ->
                          val isUser = msg.sender == "kullanici"
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                              horizontalArrangement = if (isUser) Arrangement.End else Arrangement.Start
                          ) {
                              Box(
                                  modifier = Modifier
                                      .background(
                                          if (isUser) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.surfaceVariant,
                                          shape = RoundedCornerShape(12.dp)
                                      )
                                      .padding(12.dp)
                                      .widthIn(max = 280.dp)
                              ) {
                                  Text(
                                      msg.text,
                                      color = if (isUser) MaterialTheme.colorScheme.onPrimary else MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              }
                          }
                      }
                      if (isTyping) {
                          item {
                              Text("🤖 Asistan düşünüyor...", style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(8.dp))
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = {
                          onStartVoiceInput { spokenText ->
                              sendMessage(spokenText)
                          }
                      }) {
                          Text("🎙️")
                      }
                      TextField(
                          value = userInput,
                          onValueChange = { userInput = it },
                          placeholder = { Text("Sorun veya sesle konuşun...") },
                          modifier = Modifier.weight(1f)
                      )
                      Spacer(modifier = Modifier.width(4.dp))
                      Button(onClick = { sendMessage(userInput) }) {
                          Text("Gönder")
                      }
                  }
              }
          }

          @Composable
          fun CallsScreen(callsList: List<CallInfo>, onCallNumber: (String) -> Unit, onRequestPermissions: () -> Unit) {
              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("📞 Cevapsız Aramalar (${callsList.size})", style = MaterialTheme.typography.headlineSmall)
                      Spacer(modifier = Modifier.height(8.dp))
                      if (callsList.isEmpty()) {
                          Text("Cevapsız arama kaydı yok veya arama izni verilmedi.")
                          Button(onClick = onRequestPermissions, modifier = Modifier.padding(top = 8.dp)) {
                              Text("Arama İznini Yenile")
                          }
                          Spacer(modifier = Modifier.height(16.dp))
                      }
                  }
                  items(callsList) { call ->
                      Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(12.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(call.name, style = MaterialTheme.typography.titleMedium)
                                  Text(call.number, style = MaterialTheme.typography.bodySmall)
                              }
                              Button(onClick = { onCallNumber(call.number) }) {
                                  Text("Ara")
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun NotificationsScreen(
              notificationsList: List<NotificationItem>,
              onOpenNotificationSettings: () -> Unit,
              callGemini: suspend (String) -> String,
              onCopyToClipboard: (String) -> Unit
          ) {
              val scope = rememberCoroutineScope()
              var replyMap by remember { mutableStateOf<Map<Int, String>>(emptyMap()) }
              var loadingMap by remember { mutableStateOf<Map<Int, Boolean>>(emptyMap()) }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Text("✉️ Mail & Mesajlar", style = MaterialTheme.typography.headlineSmall)
                          OutlinedButton(onClick = onOpenNotificationSettings) {
                              Text("İzin Ver")
                          }
                      }
                      Spacer(modifier = Modifier.height(8.dp))
                  }
                  items(notificationsList.mapIndexed { index, item -> Pair(index, item) }) { (idx, item) ->
                      Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Row(horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                                  Text(item.type, style = MaterialTheme.typography.labelMedium)
                                  Text(item.time, style = MaterialTheme.typography.labelSmall)
                              }
                              Text(item.title, style = MaterialTheme.typography.titleMedium)
                              Text(item.text, style = MaterialTheme.typography.bodyMedium)
                              Spacer(modifier = Modifier.height(8.dp))

                              Button(
                                  onClick = {
                                      scope.launch {
                                          loadingMap = loadingMap + (idx to true)
                                          val prompt = "Aşağıdaki mesaja kibar ve profesyonel 3 farklı Türkçe hızlı yanıt taslağı hazırla (Kabul, Red, Detay):\nMesaj: ${item.text}"
                                          val replyDrafts = callGemini(prompt)
                                          replyMap = replyMap + (idx to replyDrafts)
                                          loadingMap = loadingMap + (idx to false)
                                      }
                                  },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  if (loadingMap[idx] == true) {
                                      Text("AI Cevap Üretiyor...")
                                  } else {
                                      Text("⚡ AI Yanıt Taslağı Üret")
                                  }
                              }

                              replyMap[idx]?.let { drafts ->
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant), modifier = Modifier.fillMaxWidth()) {
                                      Column(modifier = Modifier.padding(8.dp)) {
                                          Text(drafts, style = MaterialTheme.typography.bodySmall)
                                          Spacer(modifier = Modifier.height(4.dp))
                                          OutlinedButton(onClick = { onCopyToClipboard(drafts) }, modifier = Modifier.fillMaxWidth()) {
                                              Text("📋 Yanıtları Kopyala")
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen(
              getApiKey: () -> String,
              saveApiKey: (String) -> Unit,
              onClearData: () -> Unit,
              onOpenNotificationSettings: () -> Unit,
              onRequestPermissions: () -> Unit
          ) {
              var keyInput by remember { mutableStateOf(getApiKey()) }
              var isSaved by remember { mutableStateOf(false) }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("⚙️ Ayarlar & Yapay Zeka", style = MaterialTheme.typography.headlineSmall)
                      Spacer(modifier = Modifier.height(16.dp))
                  }
                  item {
                      Card(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("🔑 Google Gemini API Anahtarı", style = MaterialTheme.typography.titleMedium)
                              Spacer(modifier = Modifier.height(4.dp))
                              Text("Yapay zekanın çalışması için ücretsiz Gemini API anahtarınızı buraya girin.", style = MaterialTheme.typography.bodySmall)
                              Spacer(modifier = Modifier.height(8.dp))
                              TextField(
                                  value = keyInput,
                                  onValueChange = {
                                      keyInput = it
                                      isSaved = false
                                  },
                                  placeholder = { Text("AIzaSy...") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                              Spacer(modifier = Modifier.height(8.dp))
                              Button(
                                  onClick = {
                                      saveApiKey(keyInput)
                                      isSaved = true
                                  },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text(if (isSaved) "✅ Kaydedildi!" else "Anahtarı Kaydet")
                              }
                          }
                      }
                  }
                  item {
                      Card(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("🔐 Sistem İzinleri", style = MaterialTheme.typography.titleMedium)
                              Spacer(modifier = Modifier.height(8.dp))
                              Button(onClick = onRequestPermissions, modifier = Modifier.fillMaxWidth()) {
                                  Text("Tüm İzinleri Yenile (Mikrofon/Arama/Takvim)")
                              }
                              Spacer(modifier = Modifier.height(8.dp))
                              Button(onClick = onOpenNotificationSettings, modifier = Modifier.fillMaxWidth()) {
                                  Text("Bildirim Dinleme İznini Aç")
                              }
                          }
                      }
                  }
                  item {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.errorContainer),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("🗑️ Tüm Verileri Sıfırla", style = MaterialTheme.typography.titleMedium)
                              Spacer(modifier = Modifier.height(8.dp))
                              Button(
                                  onClick = onClearData,
                                  colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.error),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("Tüm Verileri ve Sohbeti Sil")
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android SDK ve Lisanslari Onayla
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: APK Derle
        run: gradle assembleDebug --stacktrace

      - name: APK'yi Indirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Asistan-APK
          path: app/build/outputs/apk/debug/*.apk
