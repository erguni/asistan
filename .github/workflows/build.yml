name: Asistan APK Uretici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Proje Dosyalarini ve Kodlari Otomatik Olustur
        run: |
          mkdir -p app/src/main/java/com/asistan/app

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Asistan"
          include(":app")
          EOF

          # build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.asistan.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.asistan.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          # app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="Kişisel Asistan"
                  android:roundIcon="@android:drawable/ic_dialog_info"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AssistantNotificationService"
                      android:label="Asistan Bildirim Dinleyici"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # AssistantNotificationService.kt
          cat << 'EOF' > app/src/main/java/com/asistan/app/AssistantNotificationService.kt
          package com.asistan.app

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class AssistantNotificationService : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  sbn?.notification?.extras?.let { extras ->
                      val title = extras.getString("android.title") ?: ""
                      val text = extras.getCharSequence("android.text")?.toString() ?: ""
                      val pkg = sbn.packageName ?: ""

                      if (title.isBlank() && text.isBlank()) return

                      val appType = when {
                          pkg.contains("gm") || pkg.contains("email") -> "✉️ Mail"
                          pkg.contains("outlook") -> "💼 Outlook"
                          pkg.contains("whatsapp") -> "💬 WhatsApp"
                          pkg.contains("mms") || pkg.contains("sms") -> "📱 SMS"
                          else -> null
                      }

                      if (appType != null) {
                          val time = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                          val prefs = getSharedPreferences("asistan_veriler", MODE_PRIVATE)
                          val current = prefs.getString("bildirimler_listesi", "") ?: ""
                          val entry = "$time###$appType###$title###$text"
                          prefs.edit().putString("bildirimler_listesi", "$entry|||$current").apply()
                      }
                  }
              }
          }
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/asistan/app/MainActivity.kt
          package com.asistan.app

          import android.Manifest
          import android.app.AlarmManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.CallLog
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.core.content.ContextCompat
          import java.util.Calendar

          data class CallInfo(val name: String, val number: String, val date: String)
          data class NotificationItem(val time: String, val type: String, val title: String, val text: String)

          class MainActivity : ComponentActivity() {

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { _ -> }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestAppPermissions()

                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              MainAssistantApp(
                                  onRefreshAlarms = { checkAlarmStatus() },
                                  onRefreshCalls = { getUnreturnedCalls() },
                                  onRefreshNotifications = { getStoredNotifications() },
                                  onCallNumber = { num ->
                                      val intent = Intent(Intent.ACTION_DIAL, Uri.parse("tel:$num"))
                                      startActivity(intent)
                                  },
                                  onRequestPermissions = { requestAppPermissions() },
                                  onOpenNotificationSettings = {
                                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                                  },
                                  onClearData = { clearAllData() }
                              )
                          }
                      }
                  }
              }

              private fun requestAppPermissions() {
                  permissionLauncher.launch(
                      arrayOf(
                          Manifest.permission.READ_CALL_LOG,
                          Manifest.permission.READ_SMS,
                          Manifest.permission.POST_NOTIFICATIONS
                      )
                  )
              }

              private fun checkAlarmStatus(): Pair<Boolean, String> {
                  val alarmManager = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val nextAlarm = alarmManager.nextAlarmClock
                  val calendar = Calendar.getInstance()
                  val dayOfWeek = calendar.get(Calendar.DAY_OF_WEEK)
                  val isWeekday = dayOfWeek in Calendar.MONDAY..Calendar.FRIDAY

                  return if (nextAlarm != null) {
                      Pair(true, "Aktif bir alarmınız kurulu.")
                  } else if (isWeekday) {
                      Pair(false, "Yarın hafta içi fakat henüz kurulmuş bir alarm bulunamadı!")
                  } else {
                      Pair(true, "Hafta sonundasınız, aktif alarm yok.")
                  }
              }

              private fun getUnreturnedCalls(): List<CallInfo> {
                  val list = mutableListOf<CallInfo>()
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALL_LOG) != PackageManager.PERMISSION_GRANTED) {
                      return emptyList()
                  }
                  try {
                      val cursor = contentResolver.query(
                          CallLog.Calls.CONTENT_URI,
                          arrayOf(CallLog.Calls.NUMBER, CallLog.Calls.TYPE, CallLog.Calls.CACHED_NAME, CallLog.Calls.DATE),
                          null, null, "${CallLog.Calls.DATE} DESC LIMIT 30"
                      )
                      cursor?.use {
                          while (it.moveToNext()) {
                              val type = it.getInt(it.getColumnIndexOrThrow(CallLog.Calls.TYPE))
                              val number = it.getString(it.getColumnIndexOrThrow(CallLog.Calls.NUMBER)) ?: "Bilinmeyen"
                              val name = it.getString(it.getColumnIndexOrThrow(CallLog.Calls.CACHED_NAME)) ?: number
                              if (type == CallLog.Calls.MISSED_TYPE) {
                                  list.add(CallInfo(name, number, "Cevapsız"))
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return list
              }

              private fun getStoredNotifications(): List<NotificationItem> {
                  val prefs = getSharedPreferences("asistan_veriler", MODE_PRIVATE)
                  val raw = prefs.getString("bildirimler_listesi", "") ?: ""
                  if (raw.isBlank()) return emptyList()

                  return raw.split("|||").filter { it.isNotBlank() }.mapNotNull { item ->
                      val parts = item.split("###")
                      if (parts.size >= 4) {
                          NotificationItem(parts[0], parts[1], parts[2], parts[3])
                      } else null
                  }
              }

              private fun clearAllData() {
                  getSharedPreferences("asistan_veriler", MODE_PRIVATE).edit().clear().apply()
              }
          }

          @Composable
          fun MainAssistantApp(
              onRefreshAlarms: () -> Pair<Boolean, String>,
              onRefreshCalls: () -> List<CallInfo>,
              onRefreshNotifications: () -> List<NotificationItem>,
              onCallNumber: (String) -> Unit,
              onRequestPermissions: () -> Unit,
              onOpenNotificationSettings: () -> Unit,
              onClearData: () -> Unit
          ) {
              var selectedTab by remember { mutableStateOf(0) }
              val tabs = listOf("📊 Özet", "📞 Aramalar", "✉️ Mesajlar", "⚙️ Ayarlar")

              var alarmState by remember { mutableStateOf(Pair(true, "Yükleniyor...")) }
              var callsList by remember { mutableStateOf<List<CallInfo>>(emptyList()) }
              var notificationsList by remember { mutableStateOf<List<NotificationItem>>(emptyList()) }

              fun refreshAll() {
                  alarmState = onRefreshAlarms()
                  callsList = onRefreshCalls()
                  notificationsList = onRefreshNotifications()
              }

              LaunchedEffect(Unit) {
                  refreshAll()
              }

              Scaffold(
                  bottomBar = {
                      NavigationBar {
                          tabs.forEachIndexed { index, title ->
                              NavigationBarItem(
                                  selected = selectedTab == index,
                                  onClick = { selectedTab = index },
                                  label = { Text(title) },
                                  icon = { }
                              )
                          }
                      }
                  },
                  floatingActionButton = {
                      ExtendedFloatingActionButton(
                          onClick = { refreshAll() },
                          text = { Text("🔄 Yenile") },
                          icon = { }
                      )
                  }
              ) { padding ->
                  Box(modifier = Modifier.padding(padding).fillMaxSize()) {
                      when (selectedTab) {
                          0 -> SummaryScreen(alarmState, callsList, notificationsList, onTabSelect = { selectedTab = it })
                          1 -> CallsScreen(callsList, onCallNumber, onRequestPermissions)
                          2 -> NotificationsScreen(notificationsList, onOpenNotificationSettings)
                          3 -> SettingsScreen(onClearData = {
                              onClearData()
                              refreshAll()
                          }, onOpenNotificationSettings, onRequestPermissions)
                      }
                  }
              }
          }

          @Composable
          fun SummaryScreen(
              alarmState: Pair<Boolean, String>,
              callsList: List<CallInfo>,
              notificationsList: List<NotificationItem>,
              onTabSelect: (Int) -> Unit
          ) {
              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("👋 Merhaba, Günlük Durumun", style = MaterialTheme.typography.headlineMedium)
                      Spacer(modifier = Modifier.height(16.dp))
                  }

                  item {
                      Card(
                          colors = CardDefaults.cardColors(
                              containerColor = if (alarmState.first) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.errorContainer
                          ),
                          modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("⏰ Alarm Kontrolü", style = MaterialTheme.typography.titleMedium)
                              Spacer(modifier = Modifier.height(4.dp))
                              Text(alarmState.second, style = MaterialTheme.typography.bodyMedium)
                          }
                      }
                  }

                  item {
                      Card(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("📞 Cevapsız Aramalar (${callsList.size})", style = MaterialTheme.typography.titleMedium)
                              Spacer(modifier = Modifier.height(4.dp))
                              if (callsList.isEmpty()) {
                                  Text("Harika! Dönüş yapılmamış cevapsız arama yok.")
                              } else {
                                  Text("İlgilenmen gereken ${callsList.size} cevapsız arama var.")
                                  Button(onClick = { onTabSelect(1) }, modifier = Modifier.padding(top = 8.dp)) {
                                      Text("Aramaları Gör")
                                  }
                              }
                          }
                      }
                  }

                  item {
                      Card(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("✉️ Son Mesaj & Mailler (${notificationsList.size})", style = MaterialTheme.typography.titleMedium)
                              Spacer(modifier = Modifier.height(4.dp))
                              if (notificationsList.isEmpty()) {
                                  Text("Henüz yakalanmış bir bildirim bulunmuyor.")
                              } else {
                                  Text("Toplam ${notificationsList.size} adet mail/mesaj kaydedildi.")
                                  Button(onClick = { onTabSelect(2) }, modifier = Modifier.padding(top = 8.dp)) {
                                      Text("Mesajları İncele")
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun CallsScreen(callsList: List<CallInfo>, onCallNumber: (String) -> Unit, onRequestPermissions: () -> Unit) {
              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("📞 Cevapsız & Dönüş Bekleyenler", style = MaterialTheme.typography.headlineSmall)
                      Spacer(modifier = Modifier.height(8.dp))
                      if (callsList.isEmpty()) {
                          Text("Arama kaydı bulunamadı veya izin eksik.")
                          Button(onClick = onRequestPermissions, modifier = Modifier.padding(top = 8.dp)) {
                              Text("Arama İznini Yenile")
                          }
                          Spacer(modifier = Modifier.height(16.dp))
                      }
                  }
                  items(callsList) { call ->
                      Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(12.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(call.name, style = MaterialTheme.typography.titleMedium)
                                  Text(call.number, style = MaterialTheme.typography.bodySmall)
                              }
                              Button(onClick = { onCallNumber(call.number) }) {
                                  Text("Geri Ara")
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun NotificationsScreen(notificationsList: List<NotificationItem>, onOpenNotificationSettings: () -> Unit) {
              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text("✉️ Mail ve Mesajlar", style = MaterialTheme.typography.headlineSmall)
                          OutlinedButton(onClick = onOpenNotificationSettings) {
                              Text("İzin Ayarı")
                          }
                      }
                      Spacer(modifier = Modifier.height(8.dp))
                      if (notificationsList.isEmpty()) {
                          Text("Henüz yakalanan bildirim yok. Mail veya WhatsApp bildirimi geldiğinde otomatik buraya eklenecektir.")
                      }
                  }
                  items(notificationsList) { item ->
                      Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Row(horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                                  Text(item.type, style = MaterialTheme.typography.labelMedium)
                                  Text(item.time, style = MaterialTheme.typography.labelSmall)
                              }
                              Text(item.title, style = MaterialTheme.typography.titleMedium)
                              Text(item.text, style = MaterialTheme.typography.bodyMedium)
                          }
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen(onClearData: () -> Unit, onOpenNotificationSettings: () -> Unit, onRequestPermissions: () -> Unit) {
              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("⚙️ Ayarlar & İzinler", style = MaterialTheme.typography.headlineSmall)
                      Spacer(modifier = Modifier.height(16.dp))
                  }
                  item {
                      Card(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("🔐 Sistem İzinleri", style = MaterialTheme.typography.titleMedium)
                              Spacer(modifier = Modifier.height(8.dp))
                              Button(onClick = onRequestPermissions, modifier = Modifier.fillMaxWidth()) {
                                  Text("Arama ve SMS İzinlerini İste")
                              }
                              Spacer(modifier = Modifier.height(8.dp))
                              Button(onClick = onOpenNotificationSettings, modifier = Modifier.fillMaxWidth()) {
                                  Text("Bildirim Dinleme İznini Aç")
                              }
                          }
                      }
                  }
                  item {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.errorContainer),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("🗑️ Gizlilik ve Veri Sıfırlama", style = MaterialTheme.typography.titleMedium)
                              Text("Uygulamanın telefonunuzda sakladığı tüm verileri anında kalıcı olarak siler.", style = MaterialTheme.typography.bodySmall)
                              Spacer(modifier = Modifier.height(12.dp))
                              Button(
                                  onClick = onClearData,
                                  colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.error),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("Tüm Verileri Şimdi Sıfırla")
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android SDK ve Lisanslari Onayla
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: APK Derle
        run: gradle assembleDebug --stacktrace

      - name: APK'yi Indirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Asistan-APK
          path: app/build/outputs/apk/debug/*.apk
