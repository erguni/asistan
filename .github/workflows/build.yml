name: Asistan APK Uretici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Proje Dosyalarini ve Kodlari Otomatik Olustur
        run: |
          mkdir -p app/src/main/java/com/asistan/app

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Asistan"
          include(":app")
          EOF

          # build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.asistan.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.asistan.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 7
                  versionName = "7.0-Calls-Fixed"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                      excludes += "/META-INF/NOTICE.md"
                      excludes += "/META-INF/LICENSE.md"
                  }
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("androidx.work:work-runtime-ktx:2.9.0")
              implementation("com.sun.mail:android-mail:1.6.7")
              implementation("com.sun.mail:android-activation:1.6.7")
          }
          EOF

          # app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_CALENDAR" />
              <uses-permission android:name="android.permission.WRITE_CALENDAR" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="Ultimate AI Asistan"
                  android:roundIcon="@android:drawable/ic_dialog_info"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AssistantNotificationService"
                      android:label="AI Asistan Bildirim Dinleyici"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # AssistantNotificationService.kt
          cat << 'EOF' > app/src/main/java/com/asistan/app/AssistantNotificationService.kt
          package com.asistan.app

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class AssistantNotificationService : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  sbn?.notification?.extras?.let { extras ->
                      val title = extras.getString("android.title") ?: ""
                      val text = extras.getCharSequence("android.text")?.toString() ?: ""
                      val pkg = sbn.packageName ?: ""

                      if (title.isBlank() && text.isBlank()) return

                      val appType = when {
                          pkg.contains("whatsapp") -> "💬 WhatsApp"
                          pkg.contains("mms") || pkg.contains("sms") -> "📱 SMS"
                          else -> null
                      }

                      if (appType != null) {
                          val time = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                          val prefs = getSharedPreferences("asistan_veriler", MODE_PRIVATE)
                          val current = prefs.getString("bildirimler_listesi", "") ?: ""
                          val entry = "$time###$appType###$title###$text"
                          prefs.edit().putString("bildirimler_listesi", "$entry|||$current").apply()
                      }
                  }
              }
          }
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/asistan/app/MainActivity.kt
          package com.asistan.app

          import android.Manifest
          import android.app.AlarmManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.CalendarContract
          import android.provider.CallLog
          import android.provider.Settings
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale
          import java.util.Properties
          import javax.mail.Folder
          import javax.mail.Multipart
          import javax.mail.Part
          import javax.mail.Session

          data class CallInfo(val name: String, val number: String, val type: String, val date: String, val isMissed: Boolean)
          data class NotificationItem(val time: String, val type: String, val title: String, val text: String)
          data class FullEmailItem(val sender: String, val subject: String, val body: String, val attachments: List<String>, val date: String)
          data class ChatMessage(val sender: String, val text: String)

          class MainActivity : ComponentActivity(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null
              private var voiceInputCallback: ((String) -> Unit)? = null

              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { _ -> }

              private val speechLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == RESULT_OK && result.data != null) {
                      val spokenText = result.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.get(0) ?: ""
                      voiceInputCallback?.invoke(spokenText)
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  tts = TextToSpeech(this, this)
                  requestAppPermissions()

                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              MainAssistantApp(
                                  onRefreshAlarms = { checkAlarmStatus() },
                                  onRefreshCalls = { getRecentCalls() },
                                  onRefreshNotifications = { getStoredNotifications() },
                                  onFetchEmails = { fetchFullEmails() },
                                  onCallNumber = { num ->
                                      startActivity(Intent(Intent.ACTION_DIAL, Uri.parse("tel:$num")))
                                  },
                                  onRequestPermissions = { requestAppPermissions() },
                                  onOpenAppSettings = {
                                      val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                                          data = Uri.fromParts("package", packageName, null)
                                      }
                                      startActivity(intent)
                                  },
                                  onOpenNotificationSettings = {
                                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                                  },
                                  onClearData = { clearAllData() },
                                  getApiKey = { getSavedApiKey() },
                                  saveApiKey = { key -> saveApiKeyToPrefs(key) },
                                  getEmailConfig = { getSavedEmailConfig() },
                                  saveEmailConfig = { email, pass -> saveEmailConfigToPrefs(email, pass) },
                                  callGemini = { prompt -> askGemini(prompt) },
                                  onSpeakText = { text -> speakOut(text) },
                                  onStopSpeaking = { stopSpeaking() },
                                  onStartVoiceInput = { callback ->
                                      voiceInputCallback = callback
                                      startVoiceRecognition()
                                  },
                                  onCopyToClipboard = { text -> copyToClipboard(text) },
                                  onAddToCalendar = { title, desc -> openCalendarInsert(title, desc) }
                              )
                          }
                      }
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("tr", "TR")
                  }
              }

              private fun speakOut(text: String) {
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "AsistanTTS")
              }

              private fun stopSpeaking() {
                  tts?.stop()
              }

              private fun startVoiceRecognition() {
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "tr-TR")
                      putExtra(RecognizerIntent.EXTRA_PROMPT, "Asistan dinliyor...")
                  }
                  speechLauncher.launch(intent)
              }

              private fun copyToClipboard(text: String) {
                  val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clip = ClipData.newPlainText("AI Yanıtı", text)
                  clipboard.setPrimaryClip(clip)
                  Toast.makeText(this, "Panoya kopyalandı!", Toast.LENGTH_SHORT).show()
              }

              private fun openCalendarInsert(title: String, description: String) {
                  val intent = Intent(Intent.ACTION_INSERT).apply {
                      data = CalendarContract.Events.CONTENT_URI
                      putExtra(CalendarContract.Events.TITLE, title)
                      putExtra(CalendarContract.Events.DESCRIPTION, description)
                  }
                  startActivity(intent)
              }

              private fun requestAppPermissions() {
                  permissionLauncher.launch(
                      arrayOf(
                          Manifest.permission.READ_CALL_LOG,
                          Manifest.permission.READ_PHONE_STATE,
                          Manifest.permission.READ_CONTACTS,
                          Manifest.permission.READ_SMS,
                          Manifest.permission.RECORD_AUDIO,
                          Manifest.permission.POST_NOTIFICATIONS,
                          Manifest.permission.READ_CALENDAR,
                          Manifest.permission.WRITE_CALENDAR
                      )
                  )
              }

              private fun checkAlarmStatus(): Pair<Boolean, String> {
                  val alarmManager = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val nextAlarm = alarmManager.nextAlarmClock
                  val calendar = Calendar.getInstance()
                  val dayOfWeek = calendar.get(Calendar.DAY_OF_WEEK)
                  val isWeekday = dayOfWeek in Calendar.MONDAY..Calendar.FRIDAY

                  return if (nextAlarm != null) {
                      Pair(true, "Aktif alarmınız kurulu.")
                  } else if (isWeekday) {
                      Pair(false, "Yarın hafta içi fakat alarm bulunamadı!")
                  } else {
                      Pair(true, "Hafta sonu, alarm yok.")
                  }
              }

              private fun getRecentCalls(): List<CallInfo> {
                  val list = mutableListOf<CallInfo>()
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.READ_CALL_LOG) != PackageManager.PERMISSION_GRANTED) {
                      return emptyList()
                  }
                  try {
                      val cursor = contentResolver.query(
                          CallLog.Calls.CONTENT_URI,
                          null,
                          null,
                          null,
                          CallLog.Calls.DATE + " DESC"
                      )
                      cursor?.use {
                          val numberIdx = it.getColumnIndex(CallLog.Calls.NUMBER)
                          val typeIdx = it.getColumnIndex(CallLog.Calls.TYPE)
                          val nameIdx = it.getColumnIndex(CallLog.Calls.CACHED_NAME)
                          val dateIdx = it.getColumnIndex(CallLog.Calls.DATE)

                          var count = 0
                          while (it.moveToNext() && count < 30) {
                              val number = if (numberIdx != -1) it.getString(numberIdx) ?: "Bilinmeyen" else "Bilinmeyen"
                              val name = if (nameIdx != -1) it.getString(nameIdx) ?: number else number
                              val typeInt = if (typeIdx != -1) it.getInt(typeIdx) else CallLog.Calls.INCOMING_TYPE
                              val rawDate = if (dateIdx != -1) it.getLong(dateIdx) else 0L
                              val formattedDate = SimpleDateFormat("dd MMM HH:mm", Locale.getDefault()).format(Date(rawDate))

                              val (typeStr, isMissed) = when (typeInt) {
                                  CallLog.Calls.MISSED_TYPE -> Pair("📞 Cevapsız", true)
                                  CallLog.Calls.REJECTED_TYPE -> Pair("🚫 Reddedilen", true)
                                  CallLog.Calls.INCOMING_TYPE -> Pair("📥 Gelen Arama", false)
                                  CallLog.Calls.OUTGOING_TYPE -> Pair("📤 Giden Arama", false)
                                  else -> Pair("Arama", false)
                              }

                              list.add(CallInfo(name, number, typeStr, formattedDate, isMissed))
                              count++
                          }
                      }
                  } catch (e: Exception) {
                      list.add(CallInfo("Hata", e.message ?: "Arama hatası", "Hata", "", false))
                  }
                  return list
              }

              private fun getStoredNotifications(): List<NotificationItem> {
                  val prefs = getSharedPreferences("asistan_veriler", MODE_PRIVATE)
                  val raw = prefs.getString("bildirimler_listesi", "") ?: ""
                  if (raw.isBlank()) return emptyList()

                  return raw.split("|||").filter { it.isNotBlank() }.mapNotNull { item ->
                      val parts = item.split("###")
                      if (parts.size >= 4) {
                          NotificationItem(parts[0], parts[1], parts[2], parts[3])
                      } else null
                  }
              }

              private fun saveEmailConfigToPrefs(email: String, pass: String) {
                  getSharedPreferences("asistan_veriler", MODE_PRIVATE).edit()
                      .putString("email_user", email.trim())
                      .putString("email_pass", pass.trim())
                      .apply()
              }

              private fun getSavedEmailConfig(): Pair<String, String> {
                  val prefs = getSharedPreferences("asistan_veriler", MODE_PRIVATE)
                  return Pair(prefs.getString("email_user", "") ?: "", prefs.getString("email_pass", "") ?: "")
              }

              private suspend fun fetchFullEmails(): List<FullEmailItem> = withContext(Dispatchers.IO) {
                  val (emailUser, emailPass) = getSavedEmailConfig()
                  if (emailUser.isBlank() || emailPass.isBlank()) return@withContext emptyList()

                  val emailList = mutableListOf<FullEmailItem>()
                  try {
                      val host = when {
                          emailUser.contains("@gmail") -> "imap.gmail.com"
                          emailUser.contains("@outlook") || emailUser.contains("@hotmail") -> "outlook.office365.com"
                          emailUser.contains("@yandex") -> "imap.yandex.com"
                          else -> "imap.gmail.com"
                      }

                      val props = Properties().apply {
                          put("mail.store.protocol", "imaps")
                          put("mail.imaps.host", host)
                          put("mail.imaps.port", "993")
                          put("mail.imaps.ssl.enable", "true")
                      }

                      val session = Session.getInstance(props)
                      val store = session.getStore("imaps")
                      store.connect(host, emailUser, emailPass)

                      val inbox = store.getFolder("INBOX")
                      inbox.open(Folder.READ_ONLY)

                      val messageCount = inbox.messageCount
                      val start = maxOf(1, messageCount - 9)
                      val messages = inbox.getMessages(start, messageCount)

                      for (msg in messages.reversed()) {
                          val from = msg.from?.joinToString { it.toString() } ?: "Bilinmeyen"
                          val subject = msg.subject ?: "Konusuz"
                          val date = msg.sentDate?.let { SimpleDateFormat("dd MMM HH:mm", Locale.getDefault()).format(it) } ?: ""
                          val attachments = mutableListOf<String>()
                          val body = getTextAndAttachmentsFromMessage(msg, attachments)

                          emailList.add(FullEmailItem(from, subject, body.take(800), attachments, date))
                      }

                      inbox.close(false)
                      store.close()
                  } catch (e: Exception) {
                      emailList.add(FullEmailItem("Hata", "Mail Çekilemedi", "Detay: ${e.message}", emptyList(), ""))
                  }
                  return@withContext emailList
              }

              private fun getTextAndAttachmentsFromMessage(part: Part, attachments: MutableList<String>): String {
                  if (part.isMimeType("text/plain")) {
                      return part.content as String
                  } else if (part.isMimeType("text/html")) {
                      val html = part.content as String
                      return android.text.Html.fromHtml(html, android.text.Html.FROM_HTML_MODE_LEGACY).toString()
                  } else if (part.isMimeType("multipart/*")) {
                      val mp = part.content as Multipart
                      val sb = StringBuilder()
                      for (i in 0 until mp.count) {
                          val bodyPart = mp.getBodyPart(i)
                          if (Part.ATTACHMENT.equals(bodyPart.disposition, ignoreCase = true) || bodyPart.fileName != null) {
                              attachments.add(bodyPart.fileName ?: "Ekli Dosya")
                          } else {
                              sb.append(getTextAndAttachmentsFromMessage(bodyPart, attachments))
                          }
                      }
                      return sb.toString()
                  }
                  return ""
              }

              private fun saveApiKeyToPrefs(key: String) {
                  getSharedPreferences("asistan_veriler", MODE_PRIVATE).edit().putString("gemini_key", key.trim()).apply()
              }

              private fun getSavedApiKey(): String {
                  return getSharedPreferences("asistan_veriler", MODE_PRIVATE).getString("gemini_key", "") ?: ""
              }

              private fun clearAllData() {
                  getSharedPreferences("asistan_veriler", MODE_PRIVATE).edit().clear().apply()
              }

              private suspend fun askGemini(prompt: String): String = withContext(Dispatchers.IO) {
                  val apiKey = getSavedApiKey()
                  if (apiKey.isBlank()) {
                      return@withContext "Lütfen 'Ayarlar' sekmesinden Gemini API anahtarınızı girin."
                  }

                  val modelsToTry = listOf("gemini-2.0-flash", "gemini-1.5-flash-latest", "gemini-2.5-flash", "gemini-pro")
                  var lastError = ""

                  for (model in modelsToTry) {
                      try {
                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=$apiKey")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Content-Type", "application/json; utf-8")
                          conn.doOutput = true

                          val jsonBody = JSONObject().apply {
                              val contents = JSONArray().apply {
                                  val item = JSONObject().apply {
                                      val parts = JSONArray().apply {
                                          put(JSONObject().put("text", prompt))
                                      }
                                      put("parts", parts)
                                  }
                                  put(item)
                              }
                              put("contents", contents)
                          }

                          OutputStreamWriter(conn.outputStream).use { os ->
                              os.write(jsonBody.toString())
                              os.flush()
                          }

                          val responseCode = conn.responseCode
                          if (responseCode == 200) {
                              val responseText = conn.inputStream.bufferedReader().use { it.readText() }
                              val resJson = JSONObject(responseText)
                              val candidates = resJson.getJSONArray("candidates")
                              if (candidates.length() > 0) {
                                  return@withContext candidates.getJSONObject(0)
                                      .getJSONObject("content")
                                      .getJSONArray("parts")
                                      .getJSONObject(0)
                                      .getString("text")
                              }
                          } else {
                              val errorText = conn.errorStream?.bufferedReader()?.use { it.readText() } ?: ""
                              lastError = "Model $model: $errorText"
                              if (responseCode == 404) continue
                              else return@withContext "API Hatası ($responseCode): $errorText"
                          }
                      } catch (e: Exception) {
                          lastError = "Hata: ${e.message}"
                      }
                  }
                  return@withContext "Yapay zeka modellerine ulaşılamadı. Son hata: $lastError"
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }

          @Composable
          fun MainAssistantApp(
              onRefreshAlarms: () -> Pair<Boolean, String>,
              onRefreshCalls: () -> List<CallInfo>,
              onRefreshNotifications: () -> List<NotificationItem>,
              onFetchEmails: suspend () -> List<FullEmailItem>,
              onCallNumber: (String) -> Unit,
              onRequestPermissions: () -> Unit,
              onOpenAppSettings: () -> Unit,
              onOpenNotificationSettings: () -> Unit,
              onClearData: () -> Unit,
              getApiKey: () -> String,
              saveApiKey: (String) -> Unit,
              getEmailConfig: () -> Pair<String, String>,
              saveEmailConfig: (String, String) -> Unit,
              callGemini: suspend (String) -> String,
              onSpeakText: (String) -> Unit,
              onStopSpeaking: () -> Unit,
              onStartVoiceInput: (((String) -> Unit)) -> Unit,
              onCopyToClipboard: (String) -> Unit,
              onAddToCalendar: (String, String) -> Unit
          ) {
              var selectedTab by remember { mutableStateOf(0) }
              val tabs = listOf("Brifing", "Sohbet", "E-Postalar", "Aramalar", "Ayarlar")

              var alarmState by remember { mutableStateOf(Pair(true, "Yükleniyor...")) }
              var callsList by remember { mutableStateOf<List<CallInfo>>(emptyList()) }
              var notificationsList by remember { mutableStateOf<List<NotificationItem>>(emptyList()) }
              var emailsList by remember { mutableStateOf<List<FullEmailItem>>(emptyList()) }

              val scope = rememberCoroutineScope()

              fun refreshAll() {
                  alarmState = onRefreshAlarms()
                  callsList = onRefreshCalls()
                  notificationsList = onRefreshNotifications()
                  scope.launch {
                      emailsList = onFetchEmails()
                  }
              }

              LaunchedEffect(Unit) {
                  refreshAll()
              }

              Scaffold(
                  bottomBar = {
                      NavigationBar {
                          tabs.forEachIndexed { index, title ->
                              NavigationBarItem(
                                  selected = selectedTab == index,
                                  onClick = { selectedTab = index },
                                  label = {
                                      Text(
                                          title,
                                          style = MaterialTheme.typography.labelSmall,
                                          maxLines = 1,
                                          overflow = TextOverflow.Ellipsis
                                      )
                                  },
                                  icon = { }
                              )
                          }
                      }
                  }
              ) { padding ->
                  Box(modifier = Modifier.padding(padding).fillMaxSize()) {
                      when (selectedTab) {
                          0 -> AiBriefingScreen(alarmState, callsList, emailsList, notificationsList, callGemini, onRefresh = { refreshAll() }, onSpeakText, onStopSpeaking, onAddToCalendar)
                          1 -> AiChatScreen(alarmState, callsList, emailsList, notificationsList, callGemini, onStartVoiceInput)
                          2 -> EmailsScreen(emailsList, onFetchEmails = {
                              scope.launch { emailsList = onFetchEmails() }
                          }, callGemini, onCopyToClipboard)
                          3 -> CallsScreen(callsList, onCallNumber, onRequestPermissions, onOpenAppSettings)
                          4 -> SettingsScreen(getApiKey, saveApiKey, getEmailConfig, saveEmailConfig, onClearData = {
                              onClearData()
                              refreshAll()
                          }, onOpenNotificationSettings, onRequestPermissions, onOpenAppSettings)
                      }
                  }
              }
          }

          @Composable
          fun AiBriefingScreen(
              alarmState: Pair<Boolean, String>,
              callsList: List<CallInfo>,
              emailsList: List<FullEmailItem>,
              notificationsList: List<NotificationItem>,
              callGemini: suspend (String) -> String,
              onRefresh: () -> Unit,
              onSpeakText: (String) -> Unit,
              onStopSpeaking: () -> Unit,
              onAddToCalendar: (String, String) -> Unit
          ) {
              var aiSummary by remember { mutableStateOf("Tüm e-postalarınızı, ekli dosyaları ve aramaları analiz etmek için aşağıdaki butona basın.") }
              var isLoading by remember { mutableStateOf(false) }
              var isSpeaking by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()

              fun generateBriefing() {
                  scope.launch {
                      isLoading = true
                      onRefresh()
                      val missedCalls = callsList.filter { it.isMissed }
                      val callsText = missedCalls.joinToString("\n") { "- ${it.name} (${it.number}) [${it.date}]" }
                      val emailsText = emailsList.joinToString("\n---\n") {
                          "GÖNDEREN: ${it.sender}\nKONU: ${it.subject}\nEKLER: ${it.attachments.joinToString()}\nİÇERİK: ${it.body}"
                      }

                      val prompt = """
                          Sen kullanıcının kişisel akıllı asistanısın. Aşağıda kullanıcının telefonundaki güncel veriler ve gelen tüm mailler/ekler var:
                          
                          ALARM DURUMU: ${alarmState.second}
                          CEVAPSIZ ARAMALAR:
                          $callsText
                          
                          GELEN E-POSTALAR VE EKLİ DOSYALAR (PDF/EXCEL/SÖZLEŞME):
                          $emailsText
                          
                          GÖREVİN:
                          1. Samimi ve profesyonel bir günlük yönetici özeti sun.
                          2. Varsa acil dönülmesi gereken aramaları ve mail eklerini (fatura, teklif) belirt.
                          3. Hafta içi alarmı yoksa uyar.
                          4. Madde madde yapılacaklar listesi ver.
                      """.trimIndent()

                      aiSummary = callGemini(prompt)
                      isLoading = false
                  }
              }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("🧠 AI Yönetici Brifingi", style = MaterialTheme.typography.headlineSmall)
                      Spacer(modifier = Modifier.height(12.dp))
                  }
                  item {
                      Button(
                          onClick = { generateBriefing() },
                          enabled = !isLoading,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          if (isLoading) {
                              CircularProgressIndicator(color = MaterialTheme.colorScheme.onPrimary, modifier = Modifier.size(20.dp))
                              Spacer(modifier = Modifier.width(8.dp))
                              Text("Analiz Ediliyor...")
                          } else {
                              Text("✨ Günlük Durumu Analiz Et")
                          }
                      }
                      Spacer(modifier = Modifier.height(16.dp))
                  }
                  item {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.primaryContainer),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                                  Text("🤖 Asistan Raporu", style = MaterialTheme.typography.titleMedium)
                                  IconButton(onClick = {
                                      if (isSpeaking) {
                                          onStopSpeaking()
                                          isSpeaking = false
                                      } else {
                                          onSpeakText(aiSummary)
                                          isSpeaking = true
                                      }
                                  }) {
                                      Text(if (isSpeaking) "⏹️" else "🔊")
                                  }
                              }
                              Spacer(modifier = Modifier.height(8.dp))
                              Text(aiSummary, style = MaterialTheme.typography.bodyMedium)
                              Spacer(modifier = Modifier.height(12.dp))
                              OutlinedButton(
                                  onClick = { onAddToCalendar("Asistan Görevi", aiSummary) },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("📅 Takvime Hatırlatıcı Ekle")
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun CallsScreen(
              callsList: List<CallInfo>,
              onCallNumber: (String) -> Unit,
              onRequestPermissions: () -> Unit,
              onOpenAppSettings: () -> Unit
          ) {
              var showOnlyMissed by remember { mutableStateOf(false) }
              val filteredList = if (showOnlyMissed) callsList.filter { it.isMissed } else callsList

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("📞 Arama Geçmişi (${callsList.size})", style = MaterialTheme.typography.headlineSmall)
                      Spacer(modifier = Modifier.height(8.dp))
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          FilterChip(
                              selected = !showOnlyMissed,
                              onClick = { showOnlyMissed = false },
                              label = { Text("Tüm Aramalar") }
                          )
                          FilterChip(
                              selected = showOnlyMissed,
                              onClick = { showOnlyMissed = true },
                              label = { Text("Sadece Cevapsızlar") }
                          )
                      }
                      Spacer(modifier = Modifier.height(8.dp))

                      if (callsList.isEmpty()) {
                          Card(modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp)) {
                              Column(modifier = Modifier.padding(16.dp)) {
                                  Text("Arama kaydı okunamadı. Telefon izinlerini kontrol edin:")
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Button(onClick = onRequestPermissions, modifier = Modifier.fillMaxWidth()) {
                                      Text("İzin İste")
                                  }
                                  Spacer(modifier = Modifier.height(4.dp))
                                  OutlinedButton(onClick = onOpenAppSettings, modifier = Modifier.fillMaxWidth()) {
                                      Text("Ayarlar'da İzinleri Aç")
                                  }
                              }
                          }
                      }
                  }
                  items(filteredList) { call ->
                      Card(
                          colors = CardDefaults.cardColors(
                              containerColor = if (call.isMissed) MaterialTheme.colorScheme.errorContainer.copy(alpha = 0.5f) else MaterialTheme.colorScheme.surfaceVariant
                          ),
                          modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(12.dp),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(call.name, style = MaterialTheme.typography.titleMedium)
                                  Text("${call.type} • ${call.date}", style = MaterialTheme.typography.bodySmall)
                                  Text(call.number, style = MaterialTheme.typography.labelSmall)
                              }
                              Button(onClick = { onCallNumber(call.number) }) {
                                  Text("Ara")
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun EmailsScreen(
              emailsList: List<FullEmailItem>,
              onFetchEmails: () -> Unit,
              callGemini: suspend (String) -> String,
              onCopyToClipboard: (String) -> Unit
          ) {
              val scope = rememberCoroutineScope()
              var replyMap by remember { mutableStateOf<Map<Int, String>>(emptyMap()) }
              var loadingMap by remember { mutableStateOf<Map<Int, Boolean>>(emptyMap()) }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                          Text("📨 Gelen E-Postalar", style = MaterialTheme.typography.headlineSmall)
                          Button(onClick = onFetchEmails) {
                              Text("🔄 Çek")
                          }
                      }
                      Spacer(modifier = Modifier.height(8.dp))
                      if (emailsList.isEmpty()) {
                          Text("Henüz mail çekilmedi veya Ayarlar'da e-posta şifresi girilmedi.")
                      }
                  }
                  items(emailsList.mapIndexed { index, item -> Pair(index, item) }) { (idx, item) ->
                      Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                          Column(modifier = Modifier.padding(12.dp)) {
                              Row(horizontalArrangement = Arrangement.SpaceBetween, modifier = Modifier.fillMaxWidth()) {
                                  Text(item.sender, style = MaterialTheme.typography.titleMedium, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
                                  Text(item.date, style = MaterialTheme.typography.labelSmall)
                              }
                              Text("Konu: ${item.subject}", style = MaterialTheme.typography.bodyMedium)
                              if (item.attachments.isNotEmpty()) {
                                  Spacer(modifier = Modifier.height(4.dp))
                                  Text("📎 Ekler: ${item.attachments.joinToString()}", color = MaterialTheme.colorScheme.primary, style = MaterialTheme.typography.labelMedium)
                              }
                              Spacer(modifier = Modifier.height(4.dp))
                              Text(item.body, style = MaterialTheme.typography.bodySmall, maxLines = 4, overflow = TextOverflow.Ellipsis)
                              Spacer(modifier = Modifier.height(8.dp))

                              Button(
                                  onClick = {
                                      scope.launch {
                                          loadingMap = loadingMap + (idx to true)
                                          val prompt = "Aşağıdaki maile profesyonel 3 Türkçe yanıt taslağı hazırla:\nKonu: ${item.subject}\nİçerik: ${item.body}"
                                          val replyDrafts = callGemini(prompt)
                                          replyMap = replyMap + (idx to replyDrafts)
                                          loadingMap = loadingMap + (idx to false)
                                      }
                                  },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  if (loadingMap[idx] == true) {
                                      Text("AI Yanıt Taslağı Hazırlıyor...")
                                  } else {
                                      Text("⚡ AI Yanıtı Üret")
                                  }
                              }

                              replyMap[idx]?.let { drafts ->
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant), modifier = Modifier.fillMaxWidth()) {
                                      Column(modifier = Modifier.padding(8.dp)) {
                                          Text(drafts, style = MaterialTheme.typography.bodySmall)
                                          Spacer(modifier = Modifier.height(4.dp))
                                          OutlinedButton(onClick = { onCopyToClipboard(drafts) }, modifier = Modifier.fillMaxWidth()) {
                                              Text("📋 Yanıtları Kopyala")
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun AiChatScreen(
              alarmState: Pair<Boolean, String>,
              callsList: List<CallInfo>,
              emailsList: List<FullEmailItem>,
              notificationsList: List<NotificationItem>,
              callGemini: suspend (String) -> String,
              onStartVoiceInput: (((String) -> Unit)) -> Unit
          ) {
              val messages = remember { mutableStateListOf(ChatMessage("asistan", "Merhaba! Mailleriniz, ekli dosyalarınız ve aramalarınız hakkında bana istediğinizi sorabilirsiniz.")) }
              var userInput by remember { mutableStateOf("") }
              var isTyping by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()

              fun sendMessage(textToSend: String) {
                  if (textToSend.isNotBlank() && !isTyping) {
                      messages.add(ChatMessage("kullanici", textToSend))
                      userInput = ""
                      isTyping = true

                      scope.launch {
                          val callsText = callsList.joinToString("\n") { "- ${it.name} (${it.number}) [${it.type}]" }
                          val emailsText = emailsList.joinToString("\n") { "Mail: ${it.sender} - ${it.subject} | Ekler: ${it.attachments.joinToString()}" }
                          val fullPrompt = """
                              Sen kullanıcının cep telefonundaki akıllı kişisel sekreterisin.
                              Telefon verileri:
                              ALARM: ${alarmState.second}
                              ARAMALAR:
                              $callsText
                              MAİLLER VE EKLERİ:
                              $emailsText
                              
                              Kullanıcının sorusu: $textToSend
                              Yanıtını net, kibar ve Türkçe ver.
                          """.trimIndent()

                          val reply = callGemini(fullPrompt)
                          messages.add(ChatMessage("asistan", reply))
                          isTyping = false
                      }
                  }
              }

              Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  Text("💬 Asistanla Sohbet", style = MaterialTheme.typography.headlineSmall)
                  Spacer(modifier = Modifier.height(8.dp))

                  LazyColumn(modifier = Modifier.weight(1f).fillMaxWidth()) {
                      items(messages) { msg ->
                          val isUser = msg.sender == "kullanici"
                          Row(
                              modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                              horizontalArrangement = if (isUser) Arrangement.End else Arrangement.Start
                          ) {
                              Box(
                                  modifier = Modifier
                                      .background(
                                          if (isUser) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.surfaceVariant,
                                          shape = RoundedCornerShape(12.dp)
                                      )
                                      .padding(12.dp)
                                      .widthIn(max = 280.dp)
                              ) {
                                  Text(
                                      msg.text,
                                      color = if (isUser) MaterialTheme.colorScheme.onPrimary else MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              }
                          }
                      }
                      if (isTyping) {
                          item {
                              Text("🤖 Asistan düşünüyor...", style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(8.dp))
                          }
                      }
                  }

                  Spacer(modifier = Modifier.height(8.dp))

                  Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = {
                          onStartVoiceInput { spokenText ->
                              sendMessage(spokenText)
                          }
                      }) {
                          Text("🎙️")
                      }
                      TextField(
                          value = userInput,
                          onValueChange = { userInput = it },
                          placeholder = { Text("Sorun veya sesle konuşun...") },
                          modifier = Modifier.weight(1f)
                      )
                      Spacer(modifier = Modifier.width(4.dp))
                      Button(onClick = { sendMessage(userInput) }) {
                          Text("Gönder")
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen(
              getApiKey: () -> String,
              saveApiKey: (String) -> Unit,
              getEmailConfig: () -> Pair<String, String>,
              saveEmailConfig: (String, String) -> Unit,
              onClearData: () -> Unit,
              onOpenNotificationSettings: () -> Unit,
              onRequestPermissions: () -> Unit,
              onOpenAppSettings: () -> Unit
          ) {
              var keyInput by remember { mutableStateOf(getApiKey()) }
              var isApiKeySaved by remember { mutableStateOf(false) }

              val (savedEmail, savedPass) = getEmailConfig()
              var emailInput by remember { mutableStateOf(savedEmail) }
              var passInput by remember { mutableStateOf(savedPass) }
              var isEmailSaved by remember { mutableStateOf(false) }

              LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                  item {
                      Text("⚙️ Ayarlar & Yapay Zeka", style = MaterialTheme.typography.headlineSmall)
                      Spacer(modifier = Modifier.height(16.dp))
                  }
                  item {
                      Card(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("✉️ E-Posta Hesabı (Tam Okuma)", style = MaterialTheme.typography.titleMedium)
                              Spacer(modifier = Modifier.height(4.dp))
                              Text("Mailleri ve PDF/Excel eklerini okumak için adresinizi ve Uygulama Şifrenizi girin.", style = MaterialTheme.typography.bodySmall)
                              Spacer(modifier = Modifier.height(8.dp))
                              TextField(
                                  value = emailInput,
                                  onValueChange = { emailInput = it; isEmailSaved = false },
                                  placeholder = { Text("ornek@gmail.com") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                              Spacer(modifier = Modifier.height(8.dp))
                              TextField(
                                  value = passInput,
                                  onValueChange = { passInput = it; isEmailSaved = false },
                                  placeholder = { Text("16 Haneli Uygulama Şifresi") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                              Spacer(modifier = Modifier.height(8.dp))
                              Button(
                                  onClick = {
                                      saveEmailConfig(emailInput, passInput)
                                      isEmailSaved = true
                                  },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text(if (isEmailSaved) "✅ E-Posta Kaydedildi!" else "E-Posta Bilgilerini Kaydet")
                              }
                          }
                      }
                  }
                  item {
                      Card(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("🔑 Google Gemini API Anahtarı", style = MaterialTheme.typography.titleMedium)
                              Spacer(modifier = Modifier.height(8.dp))
                              TextField(
                                  value = keyInput,
                                  onValueChange = { keyInput = it; isApiKeySaved = false },
                                  placeholder = { Text("AIzaSy...") },
                                  modifier = Modifier.fillMaxWidth()
                              )
                              Spacer(modifier = Modifier.height(8.dp))
                              Button(
                                  onClick = {
                                      saveApiKey(keyInput)
                                      isApiKeySaved = true
                                  },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text(if (isApiKeySaved) "✅ API Kaydedildi!" else "API Anahtarını Kaydet")
                              }
                          }
                      }
                  }
                  item {
                      Card(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp)) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("🔐 Sistem İzinleri", style = MaterialTheme.typography.titleMedium)
                              Spacer(modifier = Modifier.height(8.dp))
                              Button(onClick = onRequestPermissions, modifier = Modifier.fillMaxWidth()) {
                                  Text("Tüm İzinleri İste")
                              }
                              Spacer(modifier = Modifier.height(4.dp))
                              OutlinedButton(onClick = onOpenAppSettings, modifier = Modifier.fillMaxWidth()) {
                                  Text("Uygulama İzin Ayarlarını Aç")
                              }
                              Spacer(modifier = Modifier.height(4.dp))
                              OutlinedButton(onClick = onOpenNotificationSettings, modifier = Modifier.fillMaxWidth()) {
                                  Text("Bildirim Dinleme İznini Aç")
                              }
                          }
                      }
                  }
                  item {
                      Card(
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.errorContainer),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text("🗑️ Tüm Verileri Sıfırla", style = MaterialTheme.typography.titleMedium)
                              Spacer(modifier = Modifier.height(8.dp))
                              Button(
                                  onClick = onClearData,
                                  colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.error),
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("Tüm Verileri Sıfırla")
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android SDK ve Lisanslari Onayla
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: APK Derle
        run: gradle assembleDebug --stacktrace

      - name: APK'yi Indirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Asistan-APK
          path: app/build/outputs/apk/debug/*.apk
