name: Asistan APK Uretici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Proje Dosyalarini ve Kodlari Otomatik Olustur
        run: |
          mkdir -p app/src/main/java/com/asistan/app

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Asistan"
          include(":app")
          EOF

          # build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.asistan.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.asistan.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          # app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="Kişisel Asistan"
                  android:roundIcon="@android:drawable/ic_dialog_info"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AssistantNotificationService"
                      android:label="Asistan Bildirim Dinleyici"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          # AssistantNotificationService.kt
          cat << 'EOF' > app/src/main/java/com/asistan/app/AssistantNotificationService.kt
          package com.asistan.app

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class AssistantNotificationService : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  sbn?.notification?.extras?.let { extras ->
                      val title = extras.getString("android.title") ?: ""
                      val text = extras.getCharSequence("android.text")?.toString() ?: ""
                      val pkg = sbn.packageName ?: ""

                      if (pkg.contains("android.gm") || pkg.contains("outlook") || pkg.contains("whatsapp")) {
                          val prefs = getSharedPreferences("asistan_veriler", MODE_PRIVATE)
                          val current = prefs.getString("bildirimler", "") ?: ""
                          prefs.edit().putString("bildirimler", "$current\n[$title]: $text").apply()
                      }
                  }
              }
          }
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/asistan/app/MainActivity.kt
          package com.asistan.app

          import android.Manifest
          import android.app.AlarmManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.provider.CallLog
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.core.content.ContextCompat
          import java.util.Calendar

          class MainActivity : ComponentActivity() {
              private val permissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { _ -> }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  permissionLauncher.launch(
                      arrayOf(
                          Manifest.permission.READ_CALL_LOG,
                          Manifest.permission.READ_SMS,
                          Manifest.permission.POST_NOTIFICATIONS
                      )
                  )

                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              AssistantScreen(
                                  onCheckAlarm = { checkAlarmStatus() },
                                  onCheckCalls = { getUnreturnedCalls() },
                                  onGetNotifications = { getStoredNotifications() },
                                  onClearData = { clearAllData() },
                                  onOpenNotificationSettings = {
                                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                                  }
                              )
                          }
                      }
                  }
              }

              private fun checkAlarmStatus(): String {
                  val alarmManager = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val nextAlarm = alarmManager.nextAlarmClock
                  val calendar = Calendar.getInstance()
                  val dayOfWeek = calendar.get(Calendar.DAY_OF_WEEK)
                  val isWeekday = dayOfWeek in Calendar.MONDAY..Calendar.FRIDAY
                  return if (nextAlarm != null) {
                      "✅ Aktif alarmınız kurulu."
                  } else if (isWeekday) {
                      "⚠️ DİKKAT: Hafta içindesiniz fakat yarın için kurulmuş bir alarm bulunamadı!"
                  } else {
                      "Hafta sonu, kurulu alarm yok."
                  }
              }

              private fun getUnreturnedCalls(): List<String> {
                  val unreturned = mutableListOf<Str
